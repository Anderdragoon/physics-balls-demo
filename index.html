<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>物理模拟球 · Interactive Physics Balls</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0f0f1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #eee;
    touch-action: none;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 280px;
  }
  .ui strong { color: #7dd3fc; }
  .hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="ui">
  <strong>物理模拟球</strong><br>
  点击空白处添加新球<br>
  拖拽任意球移动<br>
  重力 · 碰撞 · 弹性
</div>
<div class="hint">点击添加 · 拖拽移动 · 刷新重置</div>
<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, Bodies, World, Mouse, MouseConstraint, Events, Composite } = Matter;

const container = document.getElementById('canvas-container');

const engine = Engine.create();
const world = engine.world;
engine.gravity.y = 1.0;

const render = Render.create({
  element: container,
  engine: engine,
  options: {
    width: window.innerWidth,
    height: window.innerHeight,
    wireframes: false,
    background: 'transparent',
    pixelRatio: window.devicePixelRatio || 1
  }
});

const wallThickness = 60;
function createWalls() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return [
    Bodies.rectangle(w/2, h + wallThickness/2, w + wallThickness*2, wallThickness, { isStatic: true, render: { fillStyle: '#1a1a2e' } }),
    Bodies.rectangle(w/2, -wallThickness/2, w + wallThickness*2, wallThickness, { isStatic: true, render: { fillStyle: '#1a1a2e' } }),
    Bodies.rectangle(-wallThickness/2, h/2, wallThickness, h + wallThickness*2, { isStatic: true, render: { fillStyle: '#1a1a2e' } }),
    Bodies.rectangle(w + wallThickness/2, h/2, wallThickness, h + wallThickness*2, { isStatic: true, render: { fillStyle: '#1a1a2e' } })
  ];
}

let walls = createWalls();
World.add(world, walls);

const colors = [
  '#ef4444', '#f97316', '#eab308', '#22c55e',
  '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899',
  '#f43f5e', '#14b8a6'
];

function randomColor() {
  return colors[Math.floor(Math.random() * colors.length)];
}

function createBall(x, y, radius) {
  const ball = Bodies.circle(x, y, radius, {
    restitution: 0.75 + Math.random() * 0.2,
    friction: 0.05,
    frictionAir: 0.01,
    density: 0.0015,
    render: {
      fillStyle: randomColor(),
      strokeStyle: 'rgba(255,255,255,0.3)',
      lineWidth: 1.5
    }
  });
  return ball;
}

// 初始一批球
for (let i = 0; i < 28; i++) {
  const radius = 12 + Math.random() * 22;
  const x = 80 + Math.random() * (window.innerWidth - 160);
  const y = 40 + Math.random() * 280;
  World.add(world, createBall(x, y, radius));
}

// 鼠标控制
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse: mouse,
  constraint: {
    stiffness: 0.2,
    render: { visible: false }
  }
});
World.add(world, mouseConstraint);
render.mouse = mouse;

// 点击添加新球
Events.on(mouseConstraint, 'mouseup', (event) => {
  const mousePos = event.mouse.position;
  // 简单判断：如果没有拖拽到物体，就添加新球
  if (!mouseConstraint.body) {
    const radius = 16 + Math.random() * 18;
    const ball = createBall(mousePos.x, mousePos.y, radius);
    World.add(world, ball);
  }
});

// 窗口大小变化时重建墙壁
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  render.canvas.width = w * (window.devicePixelRatio || 1);
  render.canvas.height = h * (window.devicePixelRatio || 1);
  render.canvas.style.width = w + 'px';
  render.canvas.style.height = h + 'px';
  render.options.width = w;
  render.options.height = h;
  Render.setPixelRatio(render, window.devicePixelRatio || 1);

  World.remove(world, walls);
  walls = createWalls();
  World.add(world, walls);
}
window.addEventListener('resize', resize);

// 启动
Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

// 移动端优化
document.body.addEventListener('touchstart', (e) => {
  if (e.target === render.canvas) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
